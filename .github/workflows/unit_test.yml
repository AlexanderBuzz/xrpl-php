name: Unit Test (PHPUnit)
on: push

jobs:
  phpunit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
          tools: composer, phpunit
          extensions: ds, gmp, sockets
          coverage: none
#
      - name: Install composer dependencies
        uses: php-actions/composer@8a65f0d3c6a1d17ca4800491a40b5756a4c164f3 # v6.1.2
        with:
          php_version: "8.2"
          php_extensions: gmp sockets bcmath
          version: latest

      - name: Run PHPUnit
        run: vendor/bin/phpunit ./tests --exclude-group integration --exclude-group integration-slow

      - name: Run Psalm
        run: vendor/bin/psalm --config=psalm.xml --no-progress --no-cache
