name: Integration (Testnet)

# The tests in the integration and integration-slow groups talk to the public
# Testnet and its faucet. They run after a push to main and on request, one
# run at a time so two runs never race for the faucet, and never on pull
# requests, where a Testnet outage would block unrelated work.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Nothing here writes to GitHub.
permissions:
  contents: read

concurrency:
  group: testnet-integration
  cancel-in-progress: false

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
          tools: composer
          extensions: gmp, bcmath, sockets
          coverage: none

      - name: Install composer dependencies
        run: composer install --no-interaction --no-progress

      - name: Run the integration tests against the Testnet
        run: vendor/bin/phpunit ./tests --group integration --group integration-slow
