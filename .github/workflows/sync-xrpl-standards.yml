name: Sync XRPL Standards references

# The XLS specifications under .agents/skills/xrpl-standards/references are a
# verbatim copy from XRPLF/XRPL-Standards. This checks them against upstream
# once a week and opens a pull request with the changes, so the copy stays
# current without anything being pulled at install time.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Read-only by default; only the sync job may write, to open its pull request.
permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # create-pull-request pushes with its own token input, not with the checkout's credentials.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Sync references from XRPLF/XRPL-Standards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .agents/skills/xrpl-standards/scripts/sync-xls-standards.py

      - name: Summarize changes
        id: changes
        run: |
          if [ -z "$(git status --porcelain -- .agents/skills/xrpl-standards/references)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "References are current."
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          {
            echo "summary<<EOF"
            git diff --stat -- .agents/skills/xrpl-standards/references
            git status --porcelain -- .agents/skills/xrpl-standards/references | grep '^??' | sed 's/^?? /new: /' || true
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Open pull request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8.1.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/sync-xrpl-standards
          commit-message: "docs: sync the XRPL Standards references"
          title: "docs: sync the XRPL Standards references"
          body: |
            Weekly check of `.agents/skills/xrpl-standards/references` against
            https://github.com/XRPLF/XRPL-Standards found changes. Review the diff
            for what changed in the specifications the SDK implements.

            ${{ steps.changes.outputs.summary }}
          add-paths: .agents/skills/xrpl-standards/references
          labels: documentation
